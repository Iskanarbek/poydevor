<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Poydevor{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    input[type="text"], input[type="password"], input[type="tel"], input[type="number"],
    input[type="email"], input[type="file"], select, textarea {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 0.5rem;
      padding: 0.6rem 0.9rem;
      font-size: 0.95rem;
      background-color: #fff;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input[type="text"]:focus, input[type="password"]:focus, input[type="tel"]:focus,
    input[type="number"]:focus, input[type="email"]:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #1e293b;
      box-shadow: 0 0 0 3px rgba(30, 41, 59, 0.1);
    }
  </style>
</head>
<body class="bg-white text-gray-900 min-h-screen flex flex-col">
  <nav class="border-b border-gray-100 px-6 py-4 flex justify-between items-center">
    <a href="{% url 'home' %}" class="text-xl font-semibold text-slate-800">Poydevor</a>
    <div class="flex gap-4 text-sm items-center">
      {% if user.is_authenticated %}
        <a href="{% url 'dashboard' %}" class="text-slate-600 hover:text-slate-900">Boshqaruv paneli</a>
        <a href="{% url 'accounts:logout' %}" class="text-slate-600 hover:text-slate-900">Chiqish</a>
      {% else %}
        <a href="{% url 'accounts:login' %}" class="text-slate-600 hover:text-slate-900">Kirish</a>
        <a href="{% url 'accounts:signup' %}" class="text-slate-800 font-medium border border-slate-800 rounded-lg px-4 py-2 hover:bg-slate-800 hover:text-white transition">Ro'yxatdan o'tish</a>
      {% endif %}
    </div>
  </nav>
  <main class="flex-1 max-w-6xl mx-auto w-full px-6 py-10">
    {% block content %}{% endblock %}
  </main>
  <footer class="border-t border-gray-100 px-6 py-6 text-center text-xs text-slate-400">
    &copy; {% now "Y" %} Poydevor. Barcha huquqlar himoyalangan.
  </footer>
</body>
</html>
