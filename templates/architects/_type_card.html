<a href="{% url href_name %}" class="reveal lift group block rounded-2xl border border-charcoal-100 bg-white p-7 shadow-lg" style="--d:{{ delay }}">
  <div class="flex items-center justify-between mb-6">
    <span class="flex h-14 w-14 items-center justify-center rounded-xl bg-cream-200 text-charcoal-700 transition group-hover:bg-clay-500 group-hover:text-white">
      <svg class="icon !w-7 !h-7"><use href="#{{ icon }}"/></svg>
    </span>
    <span class="font-serif text-4xl text-charcoal-100 transition group-hover:text-clay-200">{{ n }}</span>
  </div>
  <h2 class="font-serif text-lg font-semibold text-charcoal-900 mb-2">{{ title }}</h2>
  <p class="text-sm text-charcoal-500 mb-5">{{ text }}</p>
  <span class="inline-flex items-center gap-1.5 text-sm font-medium text-clay-700">Davom etish <svg class="icon transition-transform group-hover:translate-x-1"><use href="#i-arrow"/></svg></span>
</a>
