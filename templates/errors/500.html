<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xatolik — Poydevor</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#FBF7F2;font-family:Inter,system-ui,sans-serif;color:#1F1B18}
    .card{max-width:26rem;margin:1.5rem;padding:2.25rem;background:#fff;border:1px solid #E8E3DE;border-radius:1.5rem;text-align:center;box-shadow:0 30px 60px -30px rgba(31,27,24,.3)}
    .code{font-family:Fraunces,Georgia,serif;font-size:4.5rem;font-weight:600;color:#B5562A;margin:0}
    h1{font-family:Fraunces,Georgia,serif;font-size:1.5rem;margin:.25rem 0 .5rem}
    p{font-size:.9rem;color:#6B5E52;margin:0 0 2rem}
    a{display:block;padding:.85rem 1rem;border-radius:.75rem;background:#B5562A;color:#fff;text-decoration:none;font-weight:600}
  </style>
</head>
<body>
  <div class="card">
    <p class="code">500</p>
    <h1>Nimadir xato ketdi</h1>
    <p>Bizda kutilmagan xatolik yuz berdi. Biz bundan xabardormiz. Iltimos, bosh sahifaga qaytib, birozdan so'ng qayta urinib ko'ring.</p>
    <a href="/welcome/">Bosh sahifaga qaytish</a>
  </div>
</body>
</html>
